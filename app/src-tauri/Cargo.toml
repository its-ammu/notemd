[package]
name = "app"
version = "0.1.1"
description = "notemd - your notes + todo app"
authors = ["varsni"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Pinned: time 0.3.52 broke the API that cookie 0.18.1 (a Tauri dep) relies on.
time = "=0.3.51"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-opener = "2"
