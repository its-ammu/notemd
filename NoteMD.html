<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoteMD</title>
<style>
/* =========================================================================
   NoteMD Design System — colors & type
   A minimal, paper-like notebook. Warm off-whites, soft charcoal ink.
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap');

:root {
  /* ---------------------------------------------------------------------
     Base palette — literal color tokens. Use semantic tokens below instead.
     --------------------------------------------------------------------- */

  /* Paper (backgrounds) */
  --paper:            #e9e7e1;  /* Body / canvas */
  --paper-raised:     #f5f4ef;  /* Code blocks, tables, muted panels */
  --paper-deep:       #e3e0d8;  /* Dividers, borders */

  /* Ink (text) */
  --ink-strong:       #222222;  /* Headings, titles */
  --ink:              #444444;  /* Body text */
  --ink-muted:        #888888;  /* Secondary text, metadata */
  --ink-subtle:       #bbbbbb;  /* Placeholders */
  --ink-faint:        #cccccc;  /* Disabled, very-low-priority */

  /* Accents (syntax + sparing UI use) */
  --accent-blue:      #5167F4;  /* Functions, keywords, attributes, focus rings */
  --accent-purple:    #C89EF4;  /* Blockquote borders, numbers, variables */
  --accent-rose:      #CD2C54;  /* Strings, symbols, destructive */
  --accent-deep:      #6B52AE;  /* Deep purple — secondary accent */

  /* Blockquote gradient (the one permitted gradient) */
  --blockquote-grad-a: rgba(200, 158, 244, 0.06);  /* purple wash */
  --blockquote-grad-b: rgba(81, 103, 244, 0.04);   /* blue wash */

  /* Alpha tones derived from ink — for hover/press/selection states */
  --ink-alpha-04:     rgba(34, 34, 34, 0.04);
  --ink-alpha-08:     rgba(34, 34, 34, 0.08);
  --ink-alpha-12:     rgba(34, 34, 34, 0.12);

  /* ---------------------------------------------------------------------
     Semantic tokens — use these in components.
     --------------------------------------------------------------------- */

  /* Surfaces */
  --bg:               var(--paper);
  --bg-raised:        var(--paper-raised);
  --bg-hover:         var(--ink-alpha-04);
  --bg-press:         var(--ink-alpha-08);
  --bg-selected:      var(--ink-alpha-08);

  /* Foreground */
  --fg1:              var(--ink-strong);   /* Strongest text — titles */
  --fg2:              var(--ink);          /* Body text */
  --fg3:              var(--ink-muted);    /* Secondary, metadata */
  --fg4:              var(--ink-subtle);   /* Placeholders */
  --fg5:              var(--ink-faint);    /* Disabled */

  /* Borders */
  --border:           var(--paper-deep);
  --border-strong:    #d4d0c6;
  --focus-ring:       rgba(81, 103, 244, 0.4);

  /* Semantic accents */
  --link:             var(--accent-blue);
  --danger:           var(--accent-rose);
  --highlight:        var(--accent-purple);

  /* ---------------------------------------------------------------------
     Type system
     --------------------------------------------------------------------- */

  --font-sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'Fira Code', 'SF Mono', 'Fira Mono', ui-monospace, Menlo, monospace;

  /* Scale — small, restrained. Prose-first. */
  --text-xs:   12px;   /* metadata, timestamps, keyboard glyphs */
  --text-sm:   13px;   /* sidebar items, captions */
  --text-base: 15px;   /* body prose */
  --text-md:   17px;   /* lead paragraph */
  --text-lg:   20px;   /* h4 */
  --text-xl:   24px;   /* h3 */
  --text-2xl:  28px;   /* h2 */
  --text-3xl:  34px;   /* h1 */

  /* Line heights */
  --lh-tight:   1.25;  /* headings */
  --lh-snug:    1.4;   /* UI labels */
  --lh-normal:  1.6;   /* body */
  --lh-relaxed: 1.7;   /* long-form prose */

  /* Weights */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;

  /* Tracking */
  --tracking-tight:  -0.01em;
  --tracking-normal:  0;
  --tracking-wide:    0.02em;

  /* ---------------------------------------------------------------------
     Spacing, radii, shadows, motion
     --------------------------------------------------------------------- */

  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  24px;
  --space-6:  32px;
  --space-7:  48px;
  --space-8:  64px;
  --space-9:  96px;

  --radius-sm: 4px;   /* buttons, inputs, code spans, menu items */
  --radius-md: 6px;   /* small cards */
  --radius-lg: 8px;   /* modals, command palette, larger cards */

  /* Shadows — used only for floating surfaces. Not for buttons or cards. */
  --shadow-none:    none;
  --shadow-float:   0 8px 32px rgba(34, 34, 34, 0.08);
  --shadow-overlay: 0 16px 48px rgba(34, 34, 34, 0.12);

  /* Motion */
  --dur-fast:   120ms;
  --dur-med:    180ms;
  --ease:       cubic-bezier(0.2, 0, 0.2, 1);  /* ease-out */

  /* Layout */
  --sidebar-w:    280px;
  --content-max:  680px;
  --editor-pad:   64px;
}

/* =========================================================================
   Semantic element styles — use by adding these classes, OR wrap your
   prose in .prose to get element defaults for free.
   ========================================================================= */

.prose {
  color: var(--fg2);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--lh-relaxed);
  max-width: var(--content-max);
}

.prose h1, .h1 {
  color: var(--fg1);
  font-family: var(--font-sans);
  font-size: var(--text-3xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: var(--space-7) 0 var(--space-4);
}
.prose h2, .h2 {
  color: var(--fg1);
  font-family: var(--font-sans);
  font-size: var(--text-2xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: var(--space-6) 0 var(--space-3);
}
.prose h3, .h3 {
  color: var(--fg1);
  font-family: var(--font-sans);
  font-size: var(--text-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  margin: var(--space-5) 0 var(--space-3);
}
.prose h4, .h4 {
  color: var(--fg1);
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  margin: var(--space-5) 0 var(--space-2);
}

.prose p, .p {
  color: var(--fg2);
  font-size: var(--text-base);
  line-height: var(--lh-relaxed);
  margin: var(--space-4) 0;
}

.prose a, .link {
  color: var(--link);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-fast) var(--ease);
}
.prose a:hover, .link:hover {
  border-bottom-color: var(--link);
}

.prose code, .code-inline {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px 5px;
  color: var(--fg1);
}

.prose pre, .code-block {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  line-height: var(--lh-normal);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-4);
  overflow-x: auto;
  margin: var(--space-4) 0;
}
.prose pre code, .code-block code {
  background: none;
  border: none;
  padding: 0;
}

.prose blockquote, .blockquote {
  margin: var(--space-5) 0;
  padding: var(--space-3) var(--space-5);
  border-left: 3px solid var(--accent-purple);
  background: linear-gradient(
    135deg,
    var(--blockquote-grad-a) 0%,
    var(--blockquote-grad-b) 100%
  );
  color: var(--fg2);
  font-style: italic;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.prose hr, .hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--space-6) 0;
}

.prose ul, .prose ol {
  color: var(--fg2);
  padding-left: var(--space-5);
  margin: var(--space-4) 0;
}
.prose li {
  margin: var(--space-2) 0;
  line-height: var(--lh-relaxed);
}

.prose table, .table {
  width: 100%;
  border-collapse: collapse;
  margin: var(--space-5) 0;
  font-size: var(--text-sm);
}
.prose th, .prose td {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  text-align: left;
}
.prose th {
  background: var(--bg-raised);
  font-weight: var(--fw-semibold);
  color: var(--fg1);
}

/* Keyboard glyph */
.kbd {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--fg3);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px 5px;
  display: inline-block;
  line-height: 1;
  vertical-align: baseline;
}

/* Focus ring — use wherever interactive */
.focus-ring:focus-visible,
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}


/* NoteMD UI kit — matches colors_and_type.css */
html, body { margin:0; padding:0; background: var(--bg); font-family: var(--font-sans); color: var(--fg2); }
* { box-sizing: border-box; }

/* Notebook accent — set per-notebook via inline style on .nmd-app */
.nmd-app { --nb-accent: #5167F4; }

/* Notebook tree (replaces flat note list) */
.nmd-nb { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.nmd-nb-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 8px; border-radius: 4px;
  cursor: pointer; user-select: none;
  background: transparent; border: none; text-align: left; width: 100%;
  font-family: inherit; color: var(--fg1); font-size: 13px;
  transition: background 120ms var(--ease);
}
.nmd-nb-row:hover { background: var(--bg-hover); }
.nmd-nb-chev {
  width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg3); flex-shrink: 0;
  transition: transform 120ms var(--ease);
}
.nmd-nb-chev.open { transform: rotate(90deg); }
.nmd-nb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--nb-color, var(--fg3)); }
.nmd-nb-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nmd-nb-count { font-size: 11px; color: var(--fg4); font-family: var(--font-mono); }

.nmd-nb-pages { display: flex; flex-direction: column; gap: 1px; padding-left: 22px; margin: 2px 0 6px; border-left: 1px solid var(--border); margin-left: 14px; }
.nmd-page-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 5px 10px; border-radius: 4px;
  background: transparent; border: none; text-align: left; cursor: pointer;
  font-family: inherit; transition: background 120ms var(--ease);
}
.nmd-page-row:hover { background: var(--bg-hover); }
.nmd-page-row.sel { background: var(--bg-press); }
.nmd-page-row.sel .nmd-page-title { color: var(--fg1); }
.nmd-page-title { font-size: 12.5px; color: var(--fg2); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nmd-page-meta { font-size: 10.5px; color: var(--fg4); font-family: var(--font-mono); flex-shrink: 0; }

.nmd-nb-newpage {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 4px;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-sans); font-size: 12px; color: var(--fg3);
}
.nmd-nb-newpage:hover { background: var(--bg-hover); color: var(--fg1); }

/* Notebook color picker (inline, when editing notebook) */
.nmd-color-row { display: flex; gap: 6px; padding: 2px 10px 8px; }
.nmd-color-swatch {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1px solid rgba(34,34,34,0.12);
  cursor: pointer; padding: 0; transition: transform 120ms var(--ease);
}
.nmd-color-swatch:hover { transform: scale(1.15); }
.nmd-color-swatch.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg1); }

/* Header view-mode toggle */
.nmd-view-toggle {
  display: inline-flex; background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px; gap: 2px;
}
.nmd-view-toggle button {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  padding: 4px 9px; border-radius: 3px; border: none; cursor: pointer;
  background: transparent; color: var(--fg3); line-height: 1;
  transition: all 120ms var(--ease);
}
.nmd-view-toggle button:hover { color: var(--fg1); }
.nmd-view-toggle button.active { background: var(--bg); color: var(--fg1); box-shadow: 0 1px 2px rgba(34,34,34,0.06); }

/* Notebook accent strip in header */
.nmd-nb-strip { width: 3px; align-self: stretch; background: var(--nb-accent); border-radius: 2px; margin-right: 4px; }
.nmd-nb-context { font-size: 12px; color: var(--fg3); font-family: var(--font-mono); }
.nmd-nb-context b { color: var(--fg2); font-weight: 500; }

/* Paper textures — applied to .nmd-paper */
.nmd-paper { position: relative; }
.nmd-paper.plain { background-image: none; }
.nmd-paper.dotted {
  background-image: radial-gradient(circle, rgba(34,34,34,0.18) 1px, transparent 1.2px);
  background-size: 22px 22px;
  background-position: 0 0;
}
.nmd-paper.squared {
  background-image:
    linear-gradient(to right, rgba(34,34,34,0.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(34,34,34,0.07) 1px, transparent 1px);
  background-size: 24px 24px;
}
.nmd-paper.lined {
  background-image: linear-gradient(to bottom, transparent 27px, rgba(34,34,34,0.10) 28px);
  background-size: 100% 28px;
}

/* Paper-style picker (in header) */
.nmd-paper-picker {
  display: inline-flex; gap: 2px; background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px;
}
.nmd-paper-picker button {
  width: 26px; height: 22px; border-radius: 3px; border: none; cursor: pointer;
  background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg3); transition: all 120ms var(--ease);
}
.nmd-paper-picker button:hover { color: var(--fg1); }
.nmd-paper-picker button.active { background: var(--bg); color: var(--fg1); box-shadow: 0 1px 2px rgba(34,34,34,0.06); }
.nmd-paper-picker svg { display: block; }

.nmd-app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
.nmd-app.no-sidebar { grid-template-columns: 1fr; }

/* Sidebar */
.nmd-sidebar {
  border-right: 1px solid var(--border);
  background: var(--bg);
  display: flex; flex-direction: column;
  padding: 14px 10px 8px;
  gap: 8px;
  min-width: 0;
}
.nmd-sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 4px; }
.nmd-search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg4);
}
.nmd-search input {
  flex: 1; border: none; background: transparent;
  font-family: var(--font-sans); font-size: 13px; color: var(--fg1);
  outline: none;
}
.nmd-search input::placeholder { color: var(--fg4); }
.nmd-search svg { color: var(--fg3); }
.nmd-kbd {
  font-family: var(--font-mono); font-size: 11px; color: var(--fg3);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 5px; line-height: 1;
}
.nmd-note-count { font-size: 11px; color: var(--fg3); font-family: var(--font-mono); padding: 4px 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.nmd-note-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nmd-note-item {
  display: flex; flex-direction: column; gap: 3px;
  padding: 9px 12px; border-radius: 4px;
  background: transparent; border: none; text-align: left;
  cursor: pointer; font-family: inherit;
  transition: background 120ms var(--ease);
}
.nmd-note-item:hover { background: var(--bg-hover); }
.nmd-note-item.sel { background: var(--bg-press); }
.nmd-note-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.nmd-note-title { font-size: 13px; color: var(--fg1); font-weight: 500; line-height: 1.3; }
.nmd-note-meta { font-size: 11px; color: var(--fg4); font-family: var(--font-mono); flex-shrink: 0; }
.nmd-note-preview { font-size: 12px; color: var(--fg3); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nmd-empty { padding: 40px 12px; text-align: center; color: var(--fg3); font-size: 13px; line-height: 1.6; }
.nmd-empty span { color: var(--fg4); font-size: 12px; }

/* Header */
.nmd-main { display: flex; flex-direction: column; min-width: 0; }
.nmd-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nmd-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 4px;
  background: transparent; border: none; color: var(--fg3);
  cursor: pointer; transition: background 120ms var(--ease), color 120ms var(--ease);
}
.nmd-iconbtn:hover { background: var(--bg-hover); color: var(--fg1); }
.nmd-title-input {
  flex: 1; border: none; background: transparent; outline: none;
  font-family: var(--font-sans); font-size: 17px; font-weight: 600;
  color: var(--fg1); letter-spacing: -0.01em;
}
.nmd-title-input::placeholder { color: var(--fg4); font-weight: 500; }
.nmd-saved { font-size: 12px; color: var(--fg3); font-family: var(--font-mono); }

/* Editor */
.nmd-editor { flex: 1; display: grid; min-height: 0; }
.nmd-mode-split { grid-template-columns: 1fr 1fr; }
.nmd-mode-write, .nmd-mode-preview { grid-template-columns: 1fr; }
.nmd-pane { min-width: 0; overflow-y: auto; padding: 40px 64px 80px; }
.nmd-pane-write { border-right: 1px solid var(--border); background: var(--bg); }
.nmd-mode-write .nmd-pane-write { border-right: none; }
/* Preview pane uses the paper texture; write pane stays solid for legibility */
.nmd-pane-preview { background-color: var(--bg); }
.nmd-pane-write textarea {
  width: 100%; height: 100%; min-height: 400px;
  border: none; outline: none; resize: none; background: transparent;
  font-family: var(--font-mono); font-size: 14px; line-height: 1.7;
  color: var(--fg1);
}
.nmd-pane-write textarea::placeholder { color: var(--fg4); }

/* Rendered prose (inherits .prose from colors_and_type.css) */
.nmd-rendered { max-width: var(--content-max); }
.nmd-rendered > :first-child { margin-top: 0; }

/* Command palette */
.nmd-palette-backdrop {
  position: fixed; inset: 0; background: rgba(34,34,34,0.12);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 14vh;
  animation: nmd-fade 180ms var(--ease);
  z-index: 100;
}
@keyframes nmd-fade { from { opacity: 0; } to { opacity: 1; } }
.nmd-palette {
  width: 520px; max-width: calc(100vw - 40px);
  background: var(--paper-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-overlay);
  overflow: hidden;
}
.nmd-palette input {
  width: 100%; border: none; background: transparent; outline: none;
  padding: 16px 18px; font-family: var(--font-sans); font-size: 15px;
  color: var(--fg1); border-bottom: 1px solid var(--border);
}
.nmd-palette input::placeholder { color: var(--fg4); }
.nmd-palette-list { display: flex; flex-direction: column; padding: 6px; }
.nmd-palette-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border-radius: 4px;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-sans); font-size: 14px; color: var(--fg1);
  text-align: left;
}
.nmd-palette-item:hover, .nmd-palette-item.sel { background: var(--bg-hover); }
.nmd-palette-item.danger { color: var(--danger); }
.nmd-palette-empty { padding: 16px; font-size: 13px; color: var(--fg3); text-align: center; }


/* =========================================================================
   NoteMD — Additional styles for homepage, nav, and weekly tracker
   Extends colors_and_type.css + notemd.css
   ========================================================================= */

/* --- App chrome: left nav rail + main area --- */
.nmd-app-shell {
  display: grid;
  grid-template-columns: 52px 280px 1fr;
  height: 100vh;
  background: var(--bg);
}
.nmd-app-shell.tracker-layout {
  grid-template-columns: 52px 1fr;
}

/* Left icon rail */
.nmd-rail {
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 0 10px;
  gap: 4px;
  border-right: 1px solid var(--border);
  background: var(--bg);
}
.nmd-rail-logo {
  width: 28px; height: 28px; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  position: relative;
}
.nmd-rail-logo::after {
  content: ""; position: absolute; left: 4px; right: 4px; bottom: 1px;
  height: 2px; border-radius: 1px; background: var(--accent-blue);
}
.nmd-rail-logo span {
  font-family: var(--font-sans); font-weight: 700; font-size: 18px;
  color: var(--fg1); letter-spacing: -0.02em; line-height: 1;
}

    else if (/^---+$/.test(line.trim())) { out.push(<hr key={k++}/>); i++; }
    else {
      const buf = [line]; i++;
      while (i < lines.length && lines[i].trim() !== '' && !/^(#|>|-|\d+\.|`)/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push(<p key={k++}>{renderInline(buf.join(' '))}</p>);
    }
  }
  return <div className="nmd-rendered prose">{out}</div>;
}

// Notebooks feature — notebook tree + page editor
// Relies on MarkdownView, window.useStorage

const NB_COLORS = [
  { id: 'blue',    color: '#5167F4', label: 'Blue' },
  { id: 'purple',  color: '#C89EF4', label: 'Purple' },
  { id: 'rose',    color: '#CD2C54', label: 'Rose' },
  { id: 'deep',    color: '#6B52AE', label: 'Deep' },
  { id: 'ink',     color: '#444444', label: 'Graphite' },
  { id: 'moss',    color: '#7A8A5F', label: 'Moss' },
  { id: 'rust',    color: '#B85C2C', label: 'Rust' },
];

function relTime(ts) {
  if (!ts) return '';
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return 'now';
  if (d < 3600) return Math.floor(d/60) + 'm';
  if (d < 86400) return Math.floor(d/3600) + 'h';
  const days = Math.floor(d/86400);
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd';
  if (days < 14) return 'last week';
  if (days < 30) return Math.floor(days/7) + 'w';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function NotebooksPane({ notebooks, setNotebooks, activeSel, setActiveSel }) {
  const [openIds, setOpenIds] = React.useState(() => new Set(notebooks.map(n => n.id).slice(0, 3)));

  const [creatingNb, setCreatingNb] = React.useState(false);
  const [newNbName, setNewNbName] = React.useState('');

  React.useEffect(() => { localStorage.setItem('nmd_view', view); }, [view]);

  const activeNb = notebooks.find(n => n.id === activeSel.nbId) || notebooks[0];
  const activePage = activeNb?.pages.find(p => p.id === activeSel.pageId) || activeNb?.pages[0];

  // Ensure activeSel valid
  React.useEffect(() => {
    if (!activeNb) return;
    if (!activeNb.pages.find(p => p.id === activeSel.pageId)) {
      setActiveSel({ nbId: activeNb.id, pageId: activeNb.pages[0]?.id || null });
    }
  }, [activeNb, activeSel.pageId]);

  React.useEffect(() => {
    const close = () => setMenuState(null);
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, []);

  const toggleNb = (id) => {
    setOpenIds(s => { const ns = new Set(s); if (ns.has(id)) ns.delete(id); else ns.add(id); return ns; });
  };

  const updateNb = (id, patch) => setNotebooks(nbs => nbs.map(nb => nb.id === id ? { ...nb, ...patch } : nb));
  const deleteNb = (id) => {
    if (!confirm('Delete this notebook and all its pages?')) return;
    setNotebooks(nbs => nbs.filter(nb => nb.id !== id));
  };

  const updatePage = (patch) => {
    setNotebooks(nbs => nbs.map(nb => nb.id !== activeNb.id ? nb : {
      ...nb,
      pages: nb.pages.map(p => p.id === activePage.id ? { ...p, ...patch, updated: Date.now() } : p),
    }));
  };

  const createNotebook = () => {
    const name = newNbName.trim() || 'New notebook';
    const id = 'nb' + Date.now();
    const color = NB_COLORS[notebooks.length % NB_COLORS.length].color;
    const firstPage = { id: 'p' + Date.now(), title: '', body: '', created: Date.now(), updated: Date.now() };
    const nb = { id, name, color, paper: 'plain', pages: [firstPage] };
    setNotebooks(nbs => [...nbs, nb]);
    setOpenIds(s => new Set([...s, id]));

    setNewNbName(''); setCreatingNb(false);

  const newPage = (nbId) => {
    const id = 'p' + Date.now();

    setOpenIds(s => new Set([...s, nbId]));
    setActiveSel({ nbId, pageId: id });

        <div className="nmd-nb">

                        if (e.key === 'Escape') setRenamingNbId(null);
                      }}

                  ) : (
                    <span className="nmd-nb-name">{nb.name}</span>
                  )}
                  <span className="nmd-nb-count">{nb.pages.length}</span>
                </button>
                {open && (
                  <div className="nmd-nb-pages">
                    {pages.map(p => (
                      <button
                        key={p.id}
                        className={'nmd-page-row' + (p.id === activePage?.id ? ' sel' : '')}
                        onClick={() => setActiveSel({ nbId: nb.id, pageId: p.id })}
                        onContextMenu={e => {
                          e.preventDefault(); e.stopPropagation();

                        }}
                      >
                        <span className="nmd-page-title">{p.title || 'Untitled'}</span>
                        <span className="nmd-page-meta">{relTime(p.updated)}</span>

                    <button className="nmd-nb-newpage" onClick={() => newPage(nb.id)}>
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>

      {/* Main editor area */}
      <main className="nmd-main" style={{'--nb-accent': activeNb?.color || '#5167F4'}}>
        {activeNb && activePage ? (
          <React.Fragment>
            <header className="nmd-header">
              <span className="nmd-nb-strip"/>
              <span className="nmd-nb-context"><b>{activeNb.name}</b></span>
              <span style={{color:'var(--fg4)', fontFamily:'var(--font-mono)', fontSize:12}}>/</span>
              <input
                className="nmd-title-input"
                value={activePage.title}
                placeholder="Untitled"

              />
              <span className="nmd-saved" title="Stored in your browser">Saved locally</span>
              <div className="nmd-paper-picker" title="Paper style">
                {['plain','dotted','squared'].map(pap => (
                  <button
                    key={pap}
                    className={activeNb.paper === pap ? 'active' : ''}
                    onClick={() => setPaper(pap)}
                    title={pap}
                  >
                    {pap === 'plain' && <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" strokeWidth="1.2"/></svg>}
                    {pap === 'dotted' && <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" strokeWidth="1.2"/>{[5,8,11].flatMap(y => [5,8,11].map(x => <circle key={x+','+y} cx={x} cy={y} r="0.7" fill="currentColor"/>))}</svg>}
                    {pap === 'squared' && <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" strokeWidth="1.2"/><path d="M2 6h12M2 10h12M6 2v12M10 2v12" stroke="currentColor" strokeWidth="0.6" opacity="0.6"/></svg>}
                  </button>
                ))}
              </div>
              <div className="nmd-view-toggle">
                <button className={view === 'rendered' ? 'active' : ''} onClick={() => setView('rendered')}>Read</button>
                <button className={view === 'source' ? 'active' : ''} onClick={() => setView('source')}>Edit</button>
              </div>
            </header>
            <div className="nmd-editor nmd-mode-preview">
              {view === 'source' ? (
                <div className="nmd-pane nmd-pane-write">
                  <textarea
                    value={activePage.body}

                    spellCheck={false}
                    placeholder="# Start typing&#10;&#10;Your words. On your machine."
                  />
                </div>
              ) : (
                <div className={'nmd-pane nmd-pane-preview nmd-paper ' + (activeNb.paper || 'plain')}>
                  {activePage.body.trim() ? (
                    <MarkdownView source={activePage.body} />
                  ) : (
                    <div style={{color:'var(--fg4)', fontSize:14, lineHeight:1.6, maxWidth:600}}>
                      <p style={{fontSize:15, color:'var(--fg3)'}}>Empty page.</p>
                      <p>Switch to <b style={{color:'var(--fg2)'}}>Edit</b> to start writing in markdown.</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          </React.Fragment>
        ) : (
          <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:12, color:'var(--fg3)'}}>
            <div style={{fontSize:14}}>No page selected.</div>
            <div style={{fontSize:12, color:'var(--fg4)', fontFamily:'var(--font-mono)'}}>Select a notebook, or press <span className="kbd">⌘N</span>.</div>
          </div>
        )}
      </main>

      {/* Context menu */}
      {menuState && (
        <div
          className="nmd-menu"
          style={{ left: menuState.x, top: menuState.y }}
          onClick={e => e.stopPropagation()}
        >
          {menuState.pageId ? (
            <React.Fragment>
              <button onClick={() => { setActiveSel({ nbId: menuState.nbId, pageId: menuState.pageId }); setMenuState(null); }}>
                Open page

              <button onClick={() => {
                const nb = notebooks.find(n => n.id === menuState.nbId);

                const copy = { ...p, id: 'p' + Date.now(), title: (p.title || 'Untitled') + ' copy', updated: Date.now(), created: Date.now() };
                setNotebooks(nbs => nbs.map(n => n.id === nb.id ? { ...n, pages: [copy, ...n.pages] } : n));
                setMenuState(null);
              }}>Duplicate</button>
              <hr/>
              <button className="danger" onClick={() => { deletePage(menuState.nbId, menuState.pageId); setMenuState(null); }}>
                Delete page

          ) : (
            <React.Fragment>
              <button onClick={() => { newPage(menuState.nbId); setMenuState(null); }}>New page</button>

                {NB_COLORS.map(opt => {
                  const nb = notebooks.find(n => n.id === menuState.nbId);
                  const sel = nb && nb.color === opt.color;
                  return (
                    <button
                      key={opt.id}
                      className={sel ? 'sel' : ''}

                    />

              <hr/>
              <button className="danger" onClick={() => { deleteNb(menuState.nbId); setMenuState(null); }}>Delete notebook</button>
            </React.Fragment>
          )}
        </div>
      )}
    </React.Fragment>
  );
}

// Weekly tracker — Mon-Sun columns, tasks with subtasks, priority, drag between days, copy-day

const PRIO = {
  high: { label: 'High',   color: '#CD2C54', cls: 'prio-high' },
  med:  { label: 'Medium', color: '#C89EF4', cls: 'prio-med'  },
  low:  { label: 'Low',    color: '#5167F4', cls: 'prio-low'  },
  none: { label: 'None',   color: '#bbbbbb', cls: 'prio-none' },
};

const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function startOfWeek(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  return date;
}
function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate() + n); return c; }
function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtRange(start) {
  const end = addDays(start, 6);
  const sm = start.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  const em = end.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  return `${sm} – ${em}`;
}
function weekKey(start) {
  // ISO-ish "YYYY-Www" derived from Monday start
  const y = start.getFullYear();
  const onejan = new Date(y, 0, 1);
  const w = Math.ceil((((start - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}

function TaskDialog({ task, onUpdate, onDelete, onClose }) {
  const doneCount = task.subtasks.filter(s => s.done).length;
  const updateSubtask = (id, patch) => {
    const subs = task.subtasks.map(s => s.id === id ? { ...s, ...patch } : s);
    const allDone = subs.length > 0 && subs.every(s => s.done);
    onUpdate({ subtasks: subs, done: allDone });
  };
  const addSubtask = () => {
    const id = 's' + Date.now();
    onUpdate({ subtasks: [...task.subtasks, { id, text: '', done: false, _editing: true }] });
  };

  return (
    <div className="nmd-modal-backdrop" onClick={onClose} style={{ zIndex: 1000 }}>
      <div className="nmd-modal" onClick={e => e.stopPropagation()} style={{ width: 440 }}>

          <button className="nmd-iconbtn" onClick={onClose}>
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>

        <div className="nmd-modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

             autoFocus
             value={task.title}
             onChange={e => onUpdate({ title: e.target.value })}
             style={{ width: '100%', border: 'none', background: 'transparent', outline: 'none', fontSize: 16, color: 'var(--fg1)', fontWeight: 500, resize: 'none', minHeight: 40, fontFamily: 'var(--font-sans)', lineHeight: 1.5 }}
             placeholder="Task title"
          />
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ fontSize: 12, color: 'var(--fg3)', width: 60 }}>Priority</span>
            <div className="nmd-menu-swatches" style={{ padding: 0 }}>
              {['high','med','low','none'].map(p => (
                <button
                  key={p}
                  className={task.priority === p ? 'sel' : ''}
                  style={{
                    background: PRIO[p].color, width: 18, height: 18, borderRadius: '50%', cursor: 'pointer',
                    border: task.priority === p ? `2px solid var(--fg1)` : '2px solid transparent',
                    opacity: task.priority === p ? 1 : 0.6
                  }}
                  title={PRIO[p].label}
                  onClick={() => onUpdate({ priority: p })}
                />
              ))}

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
             <span style={{ fontSize: 12, color: 'var(--fg3)' }}>Subtasks</span>
             <div className="nmd-subtasks" style={{ margin: 0 }}>
               {task.subtasks.map(s => (
                 <div key={s.id} className={'nmd-subtask' + (s.done ? ' done' : '')} style={{ display: 'flex', alignItems: 'center' }}>

                     {s.done && <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M4 12l5 5L20 6"/></svg>}
                   </button>
                   <input 
                     value={s.text}
                     onChange={e => updateSubtask(s.id, { text: e.target.value, _editing: false })}
                     onKeyDown={e => { if (e.key === 'Enter') addSubtask(); }}
                     className="nmd-subtask-text"
                     style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, fontFamily: 'inherit', fontSize: 13, color: s.done ? 'var(--fg4)' : 'var(--fg1)' }}
                     ref={el => { if (el && s._editing) { el.focus(); } }}
                     placeholder="New subtask"
                   />
                   <button className="nmd-subtask-delete" style={{ opacity: 1 }} onClick={() => onUpdate({ subtasks: task.subtasks.filter(x => x.id !== s.id) })}>×</button>
                 </div>
               ))}
               <button className="nmd-subtask-add" onClick={addSubtask} style={{ margin: '4px 0 0 0', width: 'fit-content' }}>+ add subtask</button>
             </div>

           <button onClick={onClose} style={{ background: 'var(--fg1)', color: 'var(--bg)', border: 'none', padding: '6px 14px', borderRadius: 6, fontSize: 13, cursor: 'pointer' }}>Done</button>
        </div>
      </div>
    </div>
  );
}

function Task({ task, onUpdate, onDragStart, onDragEnd, dragging, onEdit }) {
  const doneCount = task.subtasks.filter(s => s.done).length;
  const hasSubs = task.subtasks.length > 0;

  const toggleDone = (e) => {
    e.stopPropagation();
    if (hasSubs && !task.done) {
      onUpdate({ done: true, subtasks: task.subtasks.map(s => ({ ...s, done: true })) });
    } else if (hasSubs && task.done) {
      onUpdate({ done: false, subtasks: task.subtasks.map(s => ({ ...s, done: false })) });
    } else {
      onUpdate({ done: !task.done });
    }
  };

  const updateSubtask = (id, patch, e) => {
    if (e) e.stopPropagation();
    const subs = task.subtasks.map(s => s.id === id ? { ...s, ...patch } : s);
    const allDone = subs.length > 0 && subs.every(s => s.done);
    onUpdate({ subtasks: subs, done: allDone });
  };

  const cls = 'nmd-task ' + PRIO[task.priority || 'none'].cls + (task.done ? ' done' : '') + (dragging ? ' dragging' : '');
  return (
    <div
      className={cls}
      draggable
      onDragStart={(e) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', task.id);
        onDragStart(task.id);
      }}
      onDragEnd={onDragEnd}
      onClick={() => onEdit(task.id)}
      style={{ cursor: 'pointer' }}
    >
      <div className="nmd-task-row">
        <button
          className={'nmd-check' + (task.done ? ' checked' : '')}
          onClick={toggleDone}
          title={task.done ? 'Mark not done' : 'Mark done'}
          style={{ cursor: 'pointer' }}
        >
          {task.done && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M4 12l5 5L20 6"/></svg>}
        </button>
        <div className="nmd-task-title">{task.title}</div>
      </div>
      {hasSubs && (
        <React.Fragment>
          <div className="nmd-subtasks">
            {task.subtasks.map(s => (
              <div key={s.id} className={'nmd-subtask' + (s.done ? ' done' : '')}>
                <button
                  className={'nmd-check' + (s.done ? ' checked' : '')}
                  onClick={(e) => updateSubtask(s.id, { done: !s.done }, e)}
                >
                  {s.done && <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M4 12l5 5L20 6"/></svg>}
                </button>
                <span className="nmd-subtask-text">{s.text}</span>
              </div>
            ))}
          </div>
          <div className="nmd-task-progress">
            <div className="nmd-task-progress-fill" style={{width: (doneCount / task.subtasks.length * 100) + '%'}}/>
          </div>
        </React.Fragment>
      )}
      <div className="nmd-task-meta">
        {task.priority && task.priority !== 'none' && (
          <React.Fragment>
            <span className={'nmd-task-prio-dot nmd-' + PRIO[task.priority].cls}/>
            <span style={{marginLeft: 4}}>{PRIO[task.priority].label}</span>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function DayColumn({ dayIdx, date, tasks, isToday, isWeekend, onAddTask, onUpdateTask, onDeleteTask, onDropTask, onDragStart, onDragEnd, draggingId, showToast, onEditTask }) {
  const [adding, setAdding] = React.useState(false);
  const [addText, setAddText] = React.useState('');
  const [copied, setCopied] = React.useState(false);
  const [dragOver, setDragOver] = React.useState(false);

  const submitAdd = () => {
    const t = addText.trim();
    if (t) onAddTask(t);
    setAddText(''); setAdding(false);
  };

  const copyDay = () => {
    const doneTasks = tasks.filter(t => t.done || t.subtasks.some(s => s.done));
    const items = tasks.length === 0 ? ['(no entries)'] : tasks.map(t => {
      const subs = t.subtasks.map(s => `    - ${s.text}`);
      return `- ${t.title}${subs.length ? '\n' + subs.join('\n') : ''}`;
    });
    const dayLabel = DAY_NAMES[dayIdx] + ' ' + date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
    const text = `${dayLabel}\n${items.join('\n')}`;
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      showToast(`Copied ${DAY_NAMES[dayIdx]}'s entries`);
      setTimeout(() => setCopied(false), 1500);
    });
  };

  const dateNum = date.getDate();
  const monthLetter = date.toLocaleDateString(undefined, { month:'short' }).toLowerCase();

  return (
    <div
      className={'nmd-day' + (isToday ? ' today' : '') + (isWeekend ? ' weekend' : '') + (dragOver ? ' drop-target' : '')}
      onDragOver={e => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={e => {
        e.preventDefault();
        setDragOver(false);
        const id = e.dataTransfer.getData('text/plain');
        if (id) onDropTask(id);
      }}
    >
      <div className="nmd-day-header">
        <div className="nmd-day-labels">
          <span className="nmd-day-name">{DAY_NAMES[dayIdx]}</span>
          <span className="nmd-day-num">
            {dateNum}
            <span style={{fontSize:11, color:'var(--fg4)', fontWeight:400, marginLeft:4, fontFamily:'var(--font-mono)'}}>{monthLetter}</span>
          </span>
        </div>
        <div className="nmd-day-actions">
          <button
            className={'nmd-day-btn' + (copied ? ' copied' : '')}
            title="Copy entries (for timesheet)"
            onClick={copyDay}
          >
            {copied ? (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12l5 5L20 6"/></svg>
            ) : (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                <rect x="8" y="8" width="12" height="12" rx="2"/>
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
              </svg>
            )}
          </button>
          <button className="nmd-day-btn" title="New task" onClick={() => setAdding(true)}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div className="nmd-day-body">
        {tasks.length === 0 && !adding && (
          <div className="nmd-day-empty">Nothing planned.</div>
        )}
        {tasks.map(t => (
          <Task
            key={t.id}
            task={t}
            onUpdate={(patch) => onUpdateTask(t.id, patch)}
            onDragStart={onDragStart}
            onDragEnd={onDragEnd}
            dragging={draggingId === t.id}
            onEdit={onEditTask}
          />
        ))}
        {adding ? (
          <input
            autoFocus
            className="nmd-add-task-input"
            placeholder="What needs doing?"
            value={addText}
            onChange={e => setAddText(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Enter') submitAdd();
              if (e.key === 'Escape') { setAdding(false); setAddText(''); }
            }}
            onBlur={submitAdd}
          />
        ) : (
          <button className="nmd-add-task" onClick={() => setAdding(true)}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 5v14M5 12h14"/></svg>
            Add task
          </button>
        )}
      </div>
    </div>
  );
}

function WeeklyTracker({ tasksByDate, setTasksByDate, showToast }) {
  const [weekStart, setWeekStart] = React.useState(() => {
    const stored = localStorage.getItem('nmd_week');
    return stored ? startOfWeek(new Date(stored)) : startOfWeek(new Date());
  });
  const [draggingId, setDraggingId] = React.useState(null);
  const [editingTask, setEditingTask] = React.useState(null);
  const [viewMode, setViewMode] = React.useState(() => localStorage.getItem('nmd_tracker_mode') || 'full');

  React.useEffect(() => { localStorage.setItem('nmd_week', weekStart.toISOString()); }, [weekStart]);
  React.useEffect(() => { localStorage.setItem('nmd_tracker_mode', viewMode); }, [viewMode]);

  const today = new Date(); today.setHours(0,0,0,0);
  const allDays = Array.from({length: 7}, (_, i) => addDays(weekStart, i));
  const days = viewMode === 'workweek' ? allDays.slice(0, 5) : allDays;

  const getTasks = (d) => tasksByDate[fmtDate(d)] || [];

  const updateTasks = (dateKey, fn) => {
    setTasksByDate(prev => {
      const existing = prev[dateKey] || [];
      const next = fn(existing);
      if (next.length === 0) {
        const { [dateKey]: _, ...rest } = prev;
        return rest;
      }
      return { ...prev, [dateKey]: next };
    });
  };

  const addTask = (dateKey, title) => {
    const t = { id: 't' + Date.now(), title, done: false, priority: 'none', subtasks: [], created: Date.now() };
    updateTasks(dateKey, tasks => [...tasks, t]);
  };

  const updateTask = (dateKey, id, patch) => {
    updateTasks(dateKey, tasks => tasks.map(t => t.id === id ? { ...t, ...patch } : t));
  };

  const deleteTask = (dateKey, id) => {
    updateTasks(dateKey, tasks => tasks.filter(t => t.id !== id));
  };

  const moveTask = (taskId, toDateKey) => {
    let task = null, fromKey = null;
    for (const [k, list] of Object.entries(tasksByDate)) {
      const f = list.find(t => t.id === taskId);
      if (f) { task = f; fromKey = k; break; }
    }
    if (!task || fromKey === toDateKey) return;
    setTasksByDate(prev => {
      const next = { ...prev };
      const fromList = (next[fromKey] || []).filter(t => t.id !== taskId);
      if (fromList.length === 0) delete next[fromKey]; else next[fromKey] = fromList;
      next[toDateKey] = [...(next[toDateKey] || []), task];
      return next;
    });
  };

  // Summary stats
  const weekTasks = days.flatMap(d => getTasks(d));
  const doneCount = weekTasks.filter(t => t.done).length;
  const totalCount = weekTasks.length;
  const byPrio = { high: 0, med: 0, low: 0 };
  weekTasks.forEach(t => { if (byPrio[t.priority] !== undefined && !t.done) byPrio[t.priority]++; });

  const isCurrentWeek = fmtDate(weekStart) === fmtDate(startOfWeek(today));

  return (
    <div className="nmd-tracker" data-screen-label="Weekly tracker">
      <header className="nmd-tracker-header">
        <div className="nmd-tracker-title">
          <h1>Week</h1>
          <span className="nmd-tracker-range">{fmtRange(weekStart)}</span>
        </div>
        <div className="nmd-tracker-nav">
          <button className="nmd-iconbtn" title="Previous week" onClick={() => setWeekStart(addDays(weekStart, -7))}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          {!isCurrentWeek && (
            <button className="nmd-btn" onClick={() => setWeekStart(startOfWeek(new Date()))}>Today</button>
          )}
          <button className="nmd-iconbtn" title="Next week" onClick={() => setWeekStart(addDays(weekStart, 7))}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <div style={{width: 8}}/>
          <div className="nmd-view-toggle">
            <button className={viewMode === 'workweek' ? 'active' : ''} onClick={() => setViewMode('workweek')}>Workweek</button>
            <button className={viewMode === 'full' ? 'active' : ''} onClick={() => setViewMode('full')}>Full week</button>
          </div>
        </div>
        <div className="nmd-tracker-spacer"/>
        <div className="nmd-week-stats">
          <span className="nmd-pill"><b>{doneCount}</b>/{totalCount} done</span>
          {byPrio.high > 0 && <span className="nmd-pill" title="Open high-priority"><span className="nmd-task-prio-dot nmd-prio-high" style={{marginRight:5}}/><b>{byPrio.high}</b> high</span>}
          {byPrio.med > 0 && <span className="nmd-pill"><span className="nmd-task-prio-dot nmd-prio-med" style={{marginRight:5}}/><b>{byPrio.med}</b> med</span>}
        </div>
      </header>

      <div className="nmd-week-grid" style={{ gridTemplateColumns: `repeat(${days.length}, 1fr)` }}>
        {days.map((d, i) => {
          const key = fmtDate(d);
          return (
            <DayColumn
              key={key}
              dayIdx={i}
              date={d}
              tasks={getTasks(d)}
              isToday={fmtDate(d) === fmtDate(today)}
              isWeekend={i >= 5}
              onAddTask={(title) => addTask(key, title)}
              onUpdateTask={(id, patch) => updateTask(key, id, patch)}
              onDeleteTask={(id) => deleteTask(key, id)}
              onDropTask={(id) => moveTask(id, key)}
              onDragStart={setDraggingId}
              onDragEnd={() => setDraggingId(null)}
              draggingId={draggingId}
              showToast={showToast}
              onEditTask={(id) => setEditingTask({ dateKey: key, id })}
            />
          );
        })}
      </div>

      {editingTask && (() => {
        const tList = tasksByDate[editingTask.dateKey] || [];
        const task = tList.find(x => x.id === editingTask.id);
        if (!task) return null;
        return (
          <TaskDialog
            task={task}
            onUpdate={(p) => updateTask(editingTask.dateKey, task.id, p)}
            onDelete={() => { deleteTask(editingTask.dateKey, task.id); setEditingTask(null); }}
            onClose={() => setEditingTask(null)}
          />
        );
      })()}
    </div>
  );
}
</script>

/* ====================== Local storage hook ====================== */
function useStoredState(key, initial) {
  const [state, setState] = React.useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) return JSON.parse(raw);
    } catch {}
    return initial;
  });
  React.useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
  }, [key, state]);
  return [state, setState];
}

/* ====================== App ====================== */
function App() {
  const [tab, setTab] = useStoredState('nmd_tab', TWEAK_DEFAULTS.defaultView);
  const [notebooks, setNotebooks] = useStoredState('nmd_notebooks', SEED.notebooks);
  const [tasksByDate, setTasksByDate] = useStoredState('nmd_tasks', SEED.tasksByDate);
  const [activeSel, setActiveSel] = useStoredState('nmd_active', { nbId: 'nb1', pageId: 'p1' });
  const [showSettings, setShowSettings] = React.useState(false);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [toast, setToast] = React.useState(null);

  const showToast = (text) => {
    setToast(text);
    setTimeout(() => setToast(null), 1800);
  };

  /* -------------- Tweaks integration -------------- */
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  const setTweak = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  /* -------------- Keyboard shortcuts -------------- */
  React.useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key === '1') { e.preventDefault(); setTab('notebooks'); }
      if (mod && e.key === '2') { e.preventDefault(); setTab('tracker'); }
      if (mod && e.key === 'n' && tab === 'notebooks' && !e.shiftKey) {
        e.preventDefault();
        const nb = notebooks[0];
        if (nb) {
          const id = 'p' + Date.now();
          setNotebooks(nbs => nbs.map(n => n.id === nb.id ? { ...n, pages: [{id, title:'', body:'', created:Date.now(), updated:Date.now()}, ...n.pages] } : n));
          setActiveSel({ nbId: nb.id, pageId: id });
        }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [tab, notebooks]);

  /* -------------- Export / import -------------- */
  const exportData = () => {
    const payload = {
      app: 'NoteMD',
      version: 1,
      exportedAt: new Date().toISOString(),
      notebooks,
      tasksByDate,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `notemd-backup-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.notebooks && !data.tasksByDate) throw new Error('Not a NoteMD backup');
        if (!confirm('Replace current data with imported backup? This cannot be undone.')) return;
        if (data.notebooks) setNotebooks(data.notebooks);
        if (data.tasksByDate) setTasksByDate(data.tasksByDate);
        showToast('Backup restored');
        setShowSettings(false);

        alert('Could not import: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  const clearAll = () => {
    if (!confirm('Erase all notebooks and tracker data? This cannot be undone.')) return;
    setNotebooks([]);
    setTasksByDate({});
    setActiveSel({ nbId: null, pageId: null });

          </svg>
        </RailBtn>
        <RailBtn id="tracker" label="Weekly tracker (⌘2)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 9h18M8 3v4M16 3v4"/>
            <path d="M7 13h3M13 13h4M7 17h6" strokeWidth="1.2"/>
          </svg>
        </RailBtn>

        <div className="nmd-rail-spacer"/>

        <button className="nmd-rail-btn" onClick={() => setShowSettings(true)} aria-label="Settings & data">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.08a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.08a1.7 1.7 0 0 0-1.56 1z"/>
          </svg>
          <span className="nmd-tip">Settings & data</span>
        </button>
      </nav>

      {/* Main content */}
      {tab === 'notebooks' ? (
        <NotebooksPane
          notebooks={notebooks}
          setNotebooks={setNotebooks}
          activeSel={activeSel}
          setActiveSel={setActiveSel}
        />
      ) : (
        <WeeklyTracker
          tasksByDate={tasksByDate}
          setTasksByDate={setTasksByDate}
          showToast={showToast}
        />
      )}

      {/* Settings modal */}
      {showSettings && (
        <div className="nmd-modal-backdrop" onClick={() => setShowSettings(false)}>
          <div className="nmd-modal" onClick={e => e.stopPropagation()}>
            <div className="nmd-modal-header">
              <h2>Settings & data</h2>
              <button className="nmd-iconbtn" onClick={() => setShowSettings(false)}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div className="nmd-modal-body">
              <div className="nmd-modal-row">
                <div className="nmd-modal-row-text">
                  <div className="nmd-modal-row-title">Storage</div>
                  <div className="nmd-modal-row-desc">Everything lives in your browser. Nothing leaves this device.</div>
                </div>
                <span className="nmd-saved" style={{fontSize: 12}}>
                  {notebooks.reduce((a,b) => a + b.pages.length, 0)} pages · {Object.values(tasksByDate).reduce((a,b) => a + b.length, 0)} tasks
                </span>
              </div>
              <div className="nmd-modal-row">
                <div className="nmd-modal-row-text">
                  <div className="nmd-modal-row-title">Export backup</div>
                  <div className="nmd-modal-row-desc">Download a JSON file with all notebooks and tracker data.</div>
                </div>
                <button className="nmd-btn primary" onClick={exportData}>Export</button>
              </div>
              <div className="nmd-modal-row">
                <div className="nmd-modal-row-text">
                  <div className="nmd-modal-row-title">Import backup</div>
                  <div className="nmd-modal-row-desc">Replace current data with a previously exported file.</div>
                </div>
                <label className="nmd-btn" style={{cursor:'pointer'}}>
                  Import
                  <input type="file" accept=".json,application/json" style={{display:'none'}}
                    onChange={e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; }}/>
                </label>
              </div>
              <div className="nmd-modal-row">
                <div className="nmd-modal-row-text">
                  <div className="nmd-modal-row-title">Reset everything</div>
                  <div className="nmd-modal-row-desc">Erase all notebooks, pages, and tracker entries.</div>
                </div>
                <button className="nmd-btn danger" onClick={clearAll}>Erase data</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Tweaks panel */}
      {tweaksOpen && (
        <div className="nmd-tweaks">
          <h3>
            Tweaks
            <button className="nmd-iconbtn" onClick={() => setTweaksOpen(false)}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </h3>
          <div className="nmd-tweak-row">
            <label>Default view</label>
            <select value={tweaks.defaultView} onChange={e => setTweak('defaultView', e.target.value)}>
              <option value="notebooks">Notebooks</option>
              <option value="tracker">Weekly tracker</option>
            </select>
          </div>
          <div className="nmd-tweak-row">
            <label>Compact tasks</label>
            <input type="checkbox" checked={!!tweaks.compactTasks} onChange={e => setTweak('compactTasks', e.target.checked)}/>
          </div>
          <div className="nmd-tweak-row">
            <label>Brand accent everywhere</label>
            <input type="checkbox" checked={!!tweaks.accentEverywhere} onChange={e => setTweak('accentEverywhere', e.target.checked)}/>
          </div>
        </div>
      )}

      {toast && <div className="nmd-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
